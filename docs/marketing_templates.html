<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>📣 マーケティングテンプレート生成</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #0085ff; --blue-dk: #006dcc;
      --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
      --gray-400: #94a3b8; --gray-600: #475569; --gray-800: #1e293b;
      --red: #ef4444; --green: #22c55e; --orange: #f97316;
      --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--gray-50); color: var(--gray-800); min-height: 100vh;
    }
    header {
      background: #fff; border-bottom: 1px solid var(--gray-200);
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 640px; margin: 0 auto; padding: 0 16px;
      height: 56px; display: flex; align-items: center;
    }
    .header-title { font-size: 17px; font-weight: 700; color: var(--blue); }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    .card {
      background: #fff; border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px; font-weight: 700; color: var(--gray-400);
      text-transform: uppercase; letter-spacing: .07em;
      margin-bottom: 14px;
    }
    label { display: block; font-size: 14px; font-weight: 600; color: var(--gray-600); margin-bottom: 6px; }
    input[type="text"], textarea, select {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-200);
      border-radius: var(--radius); font-size: 15px; font-family: inherit;
      color: var(--gray-800); background: #fff; appearance: none;
      -webkit-appearance: none; outline: none; transition: border-color .15s;
    }
    textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
    input:focus, textarea:focus, select:focus { border-color: var(--blue); }
    .form-group { margin-bottom: 14px; }
    .form-group:last-child { margin-bottom: 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 18px; border-radius: var(--radius); border: none;
      font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: opacity .15s, transform .1s; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--blue); color: #fff; width: 100%; }
    .btn-outline {
      background: transparent; color: var(--gray-600);
      border: 1.5px solid var(--gray-200); font-size: 13px; padding: 7px 13px;
    }

    /* Type tabs */
    .type-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .type-tab {
      padding: 8px 14px; border: 1.5px solid var(--gray-200); border-radius: 999px;
      cursor: pointer; font-size: 13px; font-weight: 600; background: #fff;
      transition: border-color .15s, background .15s; user-select: none;
    }
    .type-tab.active { border-color: var(--blue); background: #eff6ff; color: var(--blue); }

    /* Tone chips */
    .tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tone-chip {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border: 1.5px solid var(--gray-200); border-radius: var(--radius);
      cursor: pointer; font-size: 13px; font-weight: 600;
      transition: border-color .15s, background .15s; background: #fff;
      user-select: none;
    }
    .tone-chip.active { border-color: var(--blue); background: #eff6ff; color: var(--blue); }

    /* Hashtag tags */
    .tag-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
    .htag {
      padding: 5px 11px; border: 1.5px solid var(--gray-200); border-radius: 999px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      transition: border-color .15s, background .15s; background: #fff;
      user-select: none;
    }
    .htag.active { border-color: var(--orange); background: #fff7ed; color: #ea580c; }

    /* Result */
    .result-card { border: 2px solid var(--blue); }
    .template-box {
      background: var(--gray-100); border-radius: 10px; padding: 14px;
      font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-word;
      color: var(--gray-800); user-select: all; min-height: 80px;
    }
    .result-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .result-label { font-size: 14px; font-weight: 700; color: var(--blue); }
    .char-count {
      font-size: 12px; font-weight: 600; color: var(--gray-400); margin-top: 8px; text-align: right;
    }
    .char-count.over { color: var(--red); }
    .action-row { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .variation-item {
      background: var(--gray-100); border-radius: 10px; padding: 12px 14px;
      font-size: 13px; line-height: 1.7; cursor: pointer;
      transition: background .15s; white-space: pre-wrap; word-break: break-word;
    }
    .variation-item:hover { background: var(--gray-200); }
    .variation-label {
      font-size: 11px; font-weight: 700; color: var(--gray-400);
      letter-spacing: .05em; margin-bottom: 6px;
    }
    .variations-list { display: flex; flex-direction: column; gap: 10px; }
    .section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--gray-600); }
    #empty { text-align: center; padding: 40px 16px; color: var(--gray-400); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="header-title">📣 マーケティングテンプレート生成</span>
  </div>
</header>
<main>

  <!-- 投稿タイプ -->
  <div class="card">
    <div class="card-title">投稿タイプ</div>
    <div class="type-tabs" id="type-tabs">
      <div class="type-tab active" data-type="recipe">🍽️ レシピ紹介</div>
      <div class="type-tab" data-type="blog">📝 ブログ告知</div>
      <div class="type-tab" data-type="campaign">🎁 キャンペーン</div>
      <div class="type-tab" data-type="new">✨ 新商品・新サービス</div>
      <div class="type-tab" data-type="engagement">💬 エンゲージメント</div>
    </div>
  </div>

  <!-- コンテンツ情報 -->
  <div class="card">
    <div class="card-title">コンテンツ情報</div>

    <div class="form-group">
      <label>タイトル・テーマ <span style="color:var(--red)">*</span></label>
      <input type="text" id="title" placeholder="例: 10分で作れる！絶品チキンカレー">
    </div>

    <div class="form-group">
      <label>ポイント・特徴（最大3つ）</label>
      <input type="text" id="point1" placeholder="例: 材料費300円以下" style="margin-bottom:8px">
      <input type="text" id="point2" placeholder="例: 包丁いらず" style="margin-bottom:8px">
      <input type="text" id="point3" placeholder="例: 冷蔵庫の残り野菜で作れる">
    </div>

    <div class="form-group">
      <label>CTA（行動喚起）</label>
      <select id="cta">
        <option value="link">🔗 リンクはプロフィールから</option>
        <option value="reply">💬 コメントで教えてください</option>
        <option value="repost">🔁 いいね・リポストよろしく</option>
        <option value="save">📌 保存して後で試してみてね</option>
        <option value="follow">👤 フォローして最新情報をゲット</option>
        <option value="none">（なし）</option>
      </select>
    </div>

    <div class="form-group">
      <label>追加情報（任意）</label>
      <input type="text" id="extra" placeholder="例: 今日の夕食にもおすすめ、週末にぜひ">
    </div>
  </div>

  <!-- トーン -->
  <div class="card">
    <div class="card-title">トーン・文体</div>
    <div class="tone-grid">
      <div class="tone-chip active" data-tone="friendly">😊 フレンドリー</div>
      <div class="tone-chip" data-tone="professional">💼 プロフェッショナル</div>
      <div class="tone-chip" data-tone="exciting">🔥 熱量高め</div>
      <div class="tone-chip" data-tone="casual">☕ カジュアル</div>
    </div>
  </div>

  <!-- ハッシュタグ -->
  <div class="card">
    <div class="card-title">ハッシュタグ</div>
    <div class="tag-wrap">
      <div class="htag" data-tag="#レシピ">#レシピ</div>
      <div class="htag" data-tag="#時短レシピ">#時短レシピ</div>
      <div class="htag" data-tag="#簡単レシピ">#簡単レシピ</div>
      <div class="htag" data-tag="#料理">#料理</div>
      <div class="htag" data-tag="#おうちごはん">#おうちごはん</div>
      <div class="htag" data-tag="#ヘルシー">#ヘルシー</div>
      <div class="htag" data-tag="#節約">#節約</div>
      <div class="htag" data-tag="#食べ物">#食べ物</div>
      <div class="htag" data-tag="#グルメ">#グルメ</div>
      <div class="htag" data-tag="#Bluesky">#Bluesky</div>
    </div>
    <div style="margin-top:10px">
      <input type="text" id="custom-tags" placeholder="カスタムハッシュタグ（スペース区切り）例: #副業 #ブログ">
    </div>
  </div>

  <button class="btn btn-primary" onclick="generate()" style="margin-bottom:16px">✨ テンプレートを生成</button>

  <div id="empty">
    <div class="empty-icon">📣</div>
    <div>タイトルを入力して生成ボタンを押してください</div>
  </div>

  <div id="result" style="display:none">
    <div class="card result-card">
      <div class="result-header">
        <span class="result-label">✨ 生成されたテンプレート</span>
        <button class="btn btn-outline" id="copy-btn" onclick="copyText()">📋 コピー</button>
      </div>
      <div class="template-box" id="template-box"></div>
      <div class="char-count" id="char-count"></div>
      <div class="action-row">
        <button class="btn btn-outline" onclick="regenerate()">🔄 再生成</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">他のトーンで試す</div>
      <div class="variations-list" id="variations"></div>
    </div>
  </div>

</main>
<script>
  const CTA_MAP = {
    link:    "詳しくはプロフィールのリンクからどうぞ🔗",
    reply:   "作ってみたら感想をコメントで教えてください💬",
    repost:  "いいね・リポストしてもらえると励みになります🙏",
    save:    "後で試したい方はポストを保存しておいてね📌",
    follow:  "フォローして最新レシピをいちはやくチェック👤",
    none:    "",
  };

  const TEMPLATES = {
    recipe: {
      friendly:     (t, pts, cta, extra) => `🍽️ ${t}\n\n${pts.map((p,i)=>` ${['✅','✅','✅'][i]} ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      professional: (t, pts, cta, extra) => `【レシピ紹介】${t}\n\nポイント：\n${pts.map((p,i)=>`${i+1}. ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      exciting:     (t, pts, cta, extra) => `🔥 これは絶対試してほしい！\n\n「${t}」\n\n${pts.map(p=>`⚡ ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      casual:       (t, pts, cta, extra) => `こんにちは☀️\n\n今日は「${t}」を作ってみました！\n\n${pts.map(p=>`→ ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
    },
    blog: {
      friendly:     (t, pts, cta, extra) => `📝 新しい記事を投稿しました！\n\n「${t}」\n\n${pts.map(p=>`👉 ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      professional: (t, pts, cta, extra) => `【ブログ更新】${t}\n\n本記事のポイント：\n${pts.map((p,i)=>`${i+1}. ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      exciting:     (t, pts, cta, extra) => `🚀 新記事公開！\n\n「${t}」\n\n${pts.map(p=>`🔥 ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      casual:       (t, pts, cta, extra) => `ブログ更新しました〜！\n\n「${t}」\n\n${pts.map(p=>`・${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
    },
    campaign: {
      friendly:     (t, pts, cta, extra) => `🎁 お知らせです！\n\n${t}\n\n${pts.map(p=>`✨ ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      professional: (t, pts, cta, extra) => `【キャンペーン情報】${t}\n\n概要：\n${pts.map((p,i)=>`${i+1}. ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      exciting:     (t, pts, cta, extra) => `🎉 見逃せないキャンペーン！\n\n${t}\n\n${pts.map(p=>`⚡ ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      casual:       (t, pts, cta, extra) => `お得なお知らせです☺️\n\n${t}\n\n${pts.map(p=>`・${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
    },
    new: {
      friendly:     (t, pts, cta, extra) => `✨ 新登場！\n\n${t}\n\n${pts.map(p=>`🆕 ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      professional: (t, pts, cta, extra) => `【新商品・新サービス】${t}\n\n特徴：\n${pts.map((p,i)=>`${i+1}. ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      exciting:     (t, pts, cta, extra) => `🚀 NEW RELEASE！\n\n「${t}」がついに登場！\n\n${pts.map(p=>`🔥 ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      casual:       (t, pts, cta, extra) => `新しいのができました〜！\n\n「${t}」\n\n${pts.map(p=>`→ ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
    },
    engagement: {
      friendly:     (t, pts, cta, extra) => `💬 みなさんに聞きたい！\n\n「${t}」について\n\n${pts.map(p=>`❓ ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      professional: (t, pts, cta, extra) => `【アンケート】${t}\n\n質問：\n${pts.map((p,i)=>`${i+1}. ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      exciting:     (t, pts, cta, extra) => `🗣️ ぜひ教えてください！\n\n「${t}」\n\n${pts.map(p=>`👉 ${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
      casual:       (t, pts, cta, extra) => `ちょっと聞いていいですか？😊\n\n${t}\n\n${pts.map(p=>`・${p}`).join('\n')}${extra ? '\n\n'+extra : ''}\n\n${cta}`,
    },
  };

  const TONE_LABELS = {
    friendly: '😊 フレンドリー', professional: '💼 プロフェッショナル',
    exciting: '🔥 熱量高め', casual: '☕ カジュアル',
  };

  let currentType = 'recipe';
  let currentTone = 'friendly';
  let activeHashtags = new Set();
  let lastText = '';

  document.querySelectorAll('.type-tab').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.type-tab').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentType = el.dataset.type;
    });
  });

  document.querySelectorAll('.tone-chip').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.tone-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentTone = el.dataset.tone;
    });
  });

  document.querySelectorAll('.htag').forEach(el => {
    el.addEventListener('click', () => {
      el.classList.toggle('active');
      if (el.classList.contains('active')) activeHashtags.add(el.dataset.tag);
      else activeHashtags.delete(el.dataset.tag);
    });
  });

  function buildText(type, tone) {
    const title = document.getElementById('title').value.trim();
    const pts = [
      document.getElementById('point1').value.trim(),
      document.getElementById('point2').value.trim(),
      document.getElementById('point3').value.trim(),
    ].filter(Boolean);
    const ctaKey = document.getElementById('cta').value;
    const cta = CTA_MAP[ctaKey];
    const extra = document.getElementById('extra').value.trim();

    const fn = TEMPLATES[type][tone];
    let body = fn(title, pts.length ? pts : [title], cta, extra);

    const customTagStr = document.getElementById('custom-tags').value.trim();
    const customTags = customTagStr ? customTagStr.split(/\s+/).filter(t => t.startsWith('#')) : [];
    const allTags = [...Array.from(activeHashtags), ...customTags];
    if (allTags.length) body += '\n\n' + allTags.join(' ');

    return body;
  }

  function updateCharCount(text) {
    const len = text.length;
    const el = document.getElementById('char-count');
    el.textContent = `${len} / 300文字`;
    el.className = 'char-count' + (len > 300 ? ' over' : '');
  }

  function generate() {
    const title = document.getElementById('title').value.trim();
    if (!title) { alert('タイトル・テーマを入力してください'); return; }

    lastText = buildText(currentType, currentTone);
    document.getElementById('template-box').textContent = lastText;
    updateCharCount(lastText);
    document.getElementById('result').style.display = '';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('copy-btn').textContent = '📋 コピー';

    // Variations for other tones
    const varBox = document.getElementById('variations');
    varBox.innerHTML = '';
    Object.keys(TONE_LABELS).filter(t => t !== currentTone).forEach(tone => {
      const vt = buildText(currentType, tone);
      const div = document.createElement('div');
      div.className = 'variation-item';
      div.innerHTML = `<div class="variation-label">${TONE_LABELS[tone]}</div><div>${escapeHtml(vt)}</div>`;
      div.onclick = () => {
        lastText = vt;
        document.getElementById('template-box').textContent = vt;
        updateCharCount(vt);
        document.getElementById('copy-btn').textContent = '📋 コピー';
      };
      varBox.appendChild(div);
    });

    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function regenerate() { generate(); }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function copyText() {
    navigator.clipboard.writeText(lastText).then(() => {
      document.getElementById('copy-btn').textContent = '✅ コピー済み';
      setTimeout(() => { document.getElementById('copy-btn').textContent = '📋 コピー'; }, 2000);
    });
  }
</script>
</body>
</html>
