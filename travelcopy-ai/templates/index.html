<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelCopy AI - ホテル記事自動生成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 40px;
        }

        .result-section {
            margin-bottom: 30px;
        }

        .result-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .hotel-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .hotel-info p {
            margin: 5px 0;
            color: #555;
        }

        .hotel-info strong {
            color: #333;
        }

        .text-content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.8;
            color: #444;
            border-left: 4px solid #667eea;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3a3;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            border-left: 4px solid #3a3;
        }

        .copy-button {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .copy-button:hover {
            background: #5568d3;
        }

        .footer {
            background: #f5f5f5;
            padding: 20px 30px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .content {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏨 TravelCopy AI</h1>
            <p>楽天トラベルのホテルから、AI がセールスコピーを自動生成</p>
        </div>

        <div class="content">
            <form id="generateForm">
                <div class="form-group">
                    <label for="hotelUrl">楽天トラベルのホテルページURL</label>
                    <input
                        type="url"
                        id="hotelUrl"
                        name="url"
                        placeholder="例: https://travel.rakuten.co.jp/hotel/147451/"
                        required
                    >
                </div>

                <button type="submit" id="generateBtn">✨ ブログ記事 & SNS投稿を生成</button>
            </form>

            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>AIが記事を生成中です...（30秒～1分お待ちください）</p>
            </div>

            <div class="results" id="results">
                <div class="result-section">
                    <div class="result-title">🏨 ホテル情報</div>
                    <div class="hotel-info">
                        <p><strong>宿名:</strong> <span id="hotelName">-</span></p>
                        <p><strong>価格:</strong> <span id="hotelPrice">-</span></p>
                        <p><strong>特徴:</strong> <span id="hotelFeatures">-</span></p>
                    </div>
                </div>

                <div class="result-section">
                    <div class="result-title">📝 ブログ記事</div>
                    <div class="text-content" id="blogContent"></div>
                    <button class="copy-button" onclick="copyToClipboard('blogContent')">
                        📋 コピー
                    </button>
                </div>

                <div class="result-section">
                    <div class="result-title">🐦 SNS投稿（Twitter/X）</div>
                    <div class="text-content" id="snsContent"></div>
                    <button class="copy-button" onclick="copyToClipboard('snsContent')">
                        📋 コピー
                    </button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>💡 初回実行時は Ollama が起動していることをご確認ください</p>
            <p style="margin-top: 10px; font-size: 12px;">TravelCopy AI v1.0</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('generateForm');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = document.getElementById('hotelUrl').value.trim();

            // エラーをクリア
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            results.style.display = 'none';

            if (!url) {
                showError('URLを入力してください');
                return;
            }

            // 送信開始
            generateBtn.disabled = true;
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'エラーが発生しました');
                }

                // 結果を表示
                displayResults(data);
                showSuccess('記事の生成に成功しました！');

            } catch (error) {
                showError(error.message);
            } finally {
                generateBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function displayResults(data) {
            document.getElementById('hotelName').textContent = data.hotel_name;
            document.getElementById('hotelPrice').textContent = data.price;
            document.getElementById('hotelFeatures').textContent = data.features.join(', ');
            document.getElementById('blogContent').textContent = data.blog;
            document.getElementById('snsContent').textContent = data.sns;
            results.style.display = 'block';

            // スクロール
            results.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.style.display = 'block';
        }

        function showSuccess(message) {
            successMessage.textContent = '✅ ' + message;
            successMessage.style.display = 'block';
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;

            navigator.clipboard.writeText(text).then(() => {
                alert('📋 コピーしました！');
            }).catch(() => {
                alert('コピーに失敗しました');
            });
        }
    </script>
</body>
</html>
