<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS トレンドワード 📊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease-in;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .update-time {
            color: #ddd;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s ease-out;
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .trending-keyword {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.2s ease;
        }

        .trending-keyword:hover {
            background: #efefef;
            transform: translateX(5px);
        }

        .keyword-rank {
            font-weight: bold;
            color: #667eea;
            font-size: 1.3rem;
            min-width: 40px;
        }

        .keyword-info {
            flex: 1;
            margin-left: 15px;
        }

        .keyword-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .keyword-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #666;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .growth {
            color: #10b981;
            font-weight: 600;
            font-size: 1rem;
        }

        .stats-section {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2rem;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .stats-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 SNS トレンドワード</h1>
            <p>トレンド分析ダッシュボード</p>
            <div class="update-time" id="updateTime">読み込み中...</div>
        </header>

        <div id="content" class="loading">
            ⏳ データを読み込んでいます...
        </div>

        <footer>
            <p>手動更新 | GitHub Pages で実現</p>
        </footer>
    </div>

    <script>
        async function loadTrends() {
            try {
                const response = await fetch('./trends.json');
                
                if (!response.ok) {
                    throw new Error(`Failed to load trends: ${response.status}`);
                }
                
                const data = await response.json();
                renderTrends(data);
            } catch (error) {
                console.error('Error loading trends:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ⚠️ データの読み込みに失敗しました。<br>
                        詳細: ${error.message}
                    </div>
                `;
            }
        }

        function renderTrends(data) {
            const content = document.getElementById('content');
            
            // Update time
            document.getElementById('updateTime').textContent = 
                `最終更新: ${data.last_updated}`;
            
            // Render stats
            let html = `
                <div class="stats-section">
                    <div class="stat-box">
                        <div class="stat-value">${data.stats.total_keywords}</div>
                        <div class="stat-label">トレンドワード</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">リアルタイム</div>
                        <div class="stat-label">更新中</div>
                    </div>
                </div>
                
                <div class="card">
                    <h2>🔥 SNS トレンドワード TOP ${data.stats.total_keywords}</h2>
            `;
            
            // Render trending keywords
            if (data.trending_keywords && data.trending_keywords.length > 0) {
                data.trending_keywords.forEach(keyword => {
                    html += `
                        <div class="trending-keyword">
                            <div class="keyword-rank">#${keyword.rank}</div>
                            <div class="keyword-info">
                                <div class="keyword-name">${keyword.keyword}</div>
                                <div class="keyword-stats">
                                    <span class="stat">${keyword.count.toLocaleString()} posts</span>
                                </div>
                            </div>
                            <div class="growth">${keyword.growth}</div>
                        </div>
                    `;
                });
            }
            
            html += `
                </div>
            `;
            
            content.innerHTML = html;
        }

        // Load trends on page load
        document.addEventListener('DOMContentLoaded', loadTrends);
        
        // Auto-refresh every 5 minutes
        setInterval(loadTrends, 5 * 60 * 1000);
    </script>
</body>
</html>
