<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASP アフィリエイト成約データビューアー（スタンドアロン）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        header h1 { font-size: 24px; margin-bottom: 5px; }
        header p { opacity: 0.9; font-size: 14px; }

        .tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            background: #f8f9fa;
        }
        .tab-button {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }
        .tab-button:hover { background: white; }

        .content {
            padding: 30px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .metric-label { font-size: 12px; color: #999; text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 28px; font-weight: bold; color: #333; }
        .metric-unit { font-size: 14px; color: #999; margin-top: 5px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            color: #666;
            border-bottom: 2px solid #eee;
            font-weight: 600;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        tr:hover { background: #f8f9fa; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }

        .tag {
            display: inline-block;
            background: #e7f3ff;
            color: #0066cc;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .json-viewer {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

        <header>
            <h1>📊 ASP アフィリエイト成約データ</h1>
            <p>スタンドアロン版ビューアー（サーバー不要）</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('overview')">📈 概要</button>
            <button class="tab-button" onclick="switchTab('links')">🔗 リンク</button>
            <button class="tab-button" onclick="switchTab('conversions')">✅ 成約</button>
            <button class="tab-button" onclick="switchTab('posts')">📝 投稿</button>
            <button class="tab-button" onclick="switchTab('raw')">🔧 RAW JSON</button>
        </div>

        <div class="content">
            <!-- 概要 -->
            <div id="overview" class="tab-content active">
                <div class="metric-grid" id="metrics"></div>
                <h3 style="margin: 30px 0 15px;">成約トレンド（日別）</h3>
                <table>
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>クリック数</th>
                            <th>成約数</th>
                            <th>成約率</th>
                            <th>売上</th>
                            <th>報酬</th>
                        </tr>
                    </thead>
                    <tbody id="dailyStats"></tbody>
                </table>
            </div>

            <!-- リンク -->
            <div id="links" class="tab-content">
                <h2 style="margin-bottom: 20px;">リンク一覧</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>タイトル</th>
                            <th>短縮URL</th>
                            <th>ASP</th>
                            <th>タグ</th>
                            <th>作成日</th>
                        </tr>
                    </thead>
                    <tbody id="linksTable"></tbody>
                </table>
            </div>

            <!-- 成約 -->
            <div id="conversions" class="tab-content">
                <h2 style="margin-bottom: 20px;">成約記録</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>リンク</th>
                            <th>クリック時刻</th>
                            <th>成約時刻</th>
                            <th>金額</th>
                            <th>報酬</th>
                            <th>ステータス</th>
                        </tr>
                    </thead>
                    <tbody id="conversionsTable"></tbody>
                </table>
            </div>

            <!-- 投稿 -->
            <div id="posts" class="tab-content">
                <h2 style="margin-bottom: 20px;">Threads投稿別成約</h2>
                <table>
                    <thead>
                        <tr>
                            <th>投稿ID</th>
                            <th>インプレッション</th>
                            <th>クリック</th>
                            <th>成約</th>
                            <th>売上</th>
                            <th>プレビュー</th>
                        </tr>
                    </thead>
                    <tbody id="postsTable"></tbody>
                </table>
            </div>

            <!-- RAW JSON -->
            <div id="raw" class="tab-content">
                <h2 style="margin-bottom: 20px;">RAW JSON データ</h2>
                <div class="json-viewer" id="jsonViewer"></div>
            </div>
        </div>

        <footer>
            このビューアーはブラウザのみで動作します。サーバーとの通信はありません。
        </footer>
    </div>

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('ja-JP', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function formatCurrency(num) {
            return '¥' + num.toLocaleString('ja-JP');
        }

        function renderMetrics() {
            const totalRevenue = DATA.conversions.reduce((sum, c) => sum + c.amount, 0);
            const totalCommission = DATA.conversions.reduce((sum, c) => sum + c.commission, 0);
            const totalConversions = DATA.conversions.length;
            const totalClicks = DATA.analytics.daily.reduce((sum, d) => sum + d.clicks, 0);
            const avgConversionRate = (totalConversions / totalClicks * 100).toFixed(2);

            const html = `
                <div class="metric-card">
                    <div class="metric-label">総成約数</div>
                    <div class="metric-value">${totalConversions}</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">総売上</div>
                    <div class="metric-value">${formatCurrency(totalRevenue)}</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">総報酬</div>
                    <div class="metric-value">${formatCurrency(totalCommission)}</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">成約率</div>
                    <div class="metric-value">${avgConversionRate}%</div>
                </div>
            `;
            document.getElementById('metrics').innerHTML = html;
        }

        function renderDailyStats() {
            const html = DATA.analytics.daily.map(d => `
                <tr>
                    <td>${d.date}</td>
                    <td>${d.clicks}</td>
                    <td>${d.conversions}</td>
                    <td>${d.conversion_rate.toFixed(1)}%</td>
                    <td>${formatCurrency(d.revenue)}</td>
                    <td>${formatCurrency(d.commission)}</td>
                </tr>
            `).join('');
            document.getElementById('dailyStats').innerHTML = html;
        }

        function renderLinks() {
            const html = DATA.links.map(link => `
                <tr>
                    <td><code>${link.id}</code></td>
                    <td><strong>${link.title}</strong></td>
                    <td><code>${link.short_url}</code></td>
                    <td>${link.asp.toUpperCase()}</td>
                    <td>${link.tags.map(t => `<span class="tag">${t}</span>`).join('')}</td>
                    <td>${new Date(link.created_at).toLocaleDateString('ja-JP')}</td>
                </tr>
            `).join('');
            document.getElementById('linksTable').innerHTML = html;
        }

        function renderConversions() {
            const linkMap = {};
            DATA.links.forEach(link => linkMap[link.id] = link.title);

            const html = DATA.conversions.map(conv => `
                <tr>
                    <td><code>${conv.id}</code></td>
                    <td>${linkMap[conv.link_id] || conv.link_id}</td>
                    <td>${formatDate(conv.click_timestamp)}</td>
                    <td>${formatDate(conv.conversion_timestamp)}</td>
                    <td>${formatCurrency(conv.amount)}</td>
                    <td>${formatCurrency(conv.commission)}</td>
                    <td><span class="status-badge status-confirmed">${conv.status}</span></td>
                </tr>
            `).join('');
            document.getElementById('conversionsTable').innerHTML = html;
        }

        function renderPosts() {
            const html = DATA.posts.map(post => `
                <tr>
                    <td><code>${post.id}</code></td>
                    <td>${post.impressions}</td>
                    <td>${post.clicks}</td>
                    <td>${post.conversions}</td>
                    <td>${formatCurrency(post.revenue)}</td>
                    <td><small>${post.content.substring(0, 40)}...</small></td>
                </tr>
            `).join('');
            document.getElementById('postsTable').innerHTML = html;
        }

        function renderJSON() {
            document.getElementById('jsonViewer').textContent = JSON.stringify(DATA, null, 2);
        }

        // 初期化
        renderMetrics();
        renderDailyStats();
        renderLinks();
        renderConversions();
        renderPosts();
        renderJSON();
    </script>
